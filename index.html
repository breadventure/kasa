<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансовая отчётность · BreadVenture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F3E9; --card:#FFFDF6; --blue:#47A2DA; --dark:#1D1D1B; --yellow:#FFE98D;
    --ink:#1D1D1B; --soft:#6E6F68; --rule:#E4E2D6; --ruleSoft:#EEEDE3;
    --in:#2E7D6B; --inSoft:#D6E7E1; --out:#B4463F; --outSoft:#F1DBD8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Wix Madefor Text',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
  h1,h2,h3{margin:0}
  .serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .card{background:var(--card);border:1.5px solid var(--dark);border-radius:10px;
    box-shadow:3px 3px 0 var(--dark);}
  .cardq{background:var(--card);border:1.5px solid var(--rule);border-radius:10px}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
  .muted{color:var(--soft)}
  .row-flex{display:flex;gap:12px;flex-wrap:wrap}
  /* header */
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .title{font-size:44px;line-height:.95}
  .sub{font-size:13px;color:var(--soft);margin-top:4px}
  .seg{display:flex;gap:0;border:1.5px solid var(--dark);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:transparent;padding:7px 13px;font-size:13px;font-weight:600;color:var(--soft)}
  .seg button.on{background:var(--dark);color:#fff}
  .gear{border:1.5px solid var(--dark);background:transparent;border-radius:8px;padding:6px 10px;font-size:15px;line-height:1;margin-left:6px}
  .gear.on{background:var(--yellow)}
  /* kpi */
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{flex:1;min-width:150px;padding:15px 17px}
  .kpi .v{font-size:27px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .h{font-size:12px;color:var(--soft);margin-top:2px}
  .panel{padding:15px 17px;margin-bottom:12px}
  .panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .linkbtn{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:12px}
  /* chips */
  .chip{border:1.5px solid var(--rule);background:transparent;color:var(--soft);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600}
  .chip.accent{border-color:var(--dark);background:var(--yellow);color:var(--dark)}
  /* legend */
  .lg{display:flex;align-items:center;gap:9px;padding:4px 0}
  .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .lg .nm{font-size:12.5px}
  .bar-track{flex:1;height:6px;background:var(--ruleSoft);border-radius:2px;overflow:hidden;min-width:24px}
  .bar-fill{height:100%}
  /* table */
  .tx{border-bottom:1px solid var(--ruleSoft)}
  .tx-main{display:flex;align-items:center;gap:12px;padding:10px 2px;flex-wrap:wrap}
  .tx .d{width:44px;flex:0 0 auto;font-size:12px;color:var(--soft)}
  .tx .who{flex:1 1 150px;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .cat{width:150px;flex:0 0 auto;position:relative}
  .tx .amt{width:104px;flex:0 0 auto;text-align:right;font-weight:600;font-size:13.5px}
  .tx .act{width:118px;flex:0 0 auto;text-align:right;display:flex;gap:10px;justify-content:flex-end}
  .tag{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-size:12px;color:var(--ink);padding:2px 0}
  .tag.empty{border:1px dashed var(--rule);border-radius:6px;padding:2px 8px;color:var(--soft)}
  .miniact{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--soft)}
  .miniact.on{color:var(--blue)}
  .clip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--in)}
  .pop{position:absolute;top:24px;left:0;z-index:30;background:var(--card);border:1.5px solid var(--dark);border-radius:8px;box-shadow:3px 3px 0 var(--dark);padding:5px;min-width:150px}
  .pop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 8px;font-size:12.5px;text-align:left;border-radius:5px}
  .pop button:hover{background:var(--ruleSoft)}
  .pop .pickrow{display:flex;align-items:center;gap:2px}
  .pop .pickrow>button[data-pick]{flex:1}
  .pop .star{border:0;background:transparent;color:var(--rule);cursor:pointer;font-size:15px;padding:4px 8px;border-radius:5px;flex:0 0 auto}
  .pop .star:hover{color:#E0A800;background:var(--yellow)}
  /* split */
  .split{background:#FBF7E8;border-left:3px solid var(--yellow);padding:14px 16px}
  .split .srow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  input[type=number],input[type=text],input[type=date],select.inp{border:1.5px solid var(--rule);border-radius:6px;padding:6px 8px;font-size:12.5px;background:#fff;color:var(--ink)}
  .btn{border:1.5px solid var(--dark);background:var(--dark);color:#fff;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:700}
  .btn.ghost{background:transparent;color:var(--soft);border-color:var(--rule)}
  .btn.accent{background:var(--yellow);color:var(--dark)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  /* commissions */
  .agg-sum{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
  .agg-sum .v{font-size:22px;font-weight:700;margin-top:3px}
  .agg-badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:flex;align-items:center;gap:7px;border:1.5px solid var(--rule);border-radius:7px;padding:5px 10px;background:#fff}
  .agg-th{display:flex;gap:10px;padding:0 0 6px;border-bottom:1px solid var(--ruleSoft);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
  .agg-tr{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ruleSoft);flex-wrap:wrap}
  /* misc */
  .empty{padding:34px 10px;text-align:center;color:var(--soft);font-size:13px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--dark);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .loader{padding:60px 10px;text-align:center;color:var(--soft)}
  .period{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;
    background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px}
  .period-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .period-r{display:flex;gap:8px}
  .period .inp{padding:5px 8px}
  .viewtabs{display:flex;gap:6px;margin-bottom:16px}
  .viewtabs button{border:1.5px solid var(--dark);background:transparent;color:var(--soft);border-radius:8px;padding:7px 16px;font-size:13px;font-weight:700}
  .viewtabs button.on{background:var(--dark);color:#fff}
  .cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .cmp-tbl{border-collapse:collapse;min-width:100%;font-size:13px}
  .cmp-tbl th,.cmp-tbl td{padding:9px 12px;border-bottom:1px solid var(--ruleSoft);text-align:right;white-space:nowrap}
  .cmp-tbl th:first-child,.cmp-tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:500;min-width:150px}
  .cmp-tbl thead th{border-bottom:1.5px solid var(--dark);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);vertical-align:bottom}
  .cmp-tbl .grouprow td{background:var(--bg);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-align:left}
  .cmp-val{font-variant-numeric:tabular-nums;font-weight:600}
  .cmp-d{font-size:11px;font-variant-numeric:tabular-nums;display:block;margin-top:1px}
  .up{color:var(--in)} .down{color:var(--out)} .flat{color:var(--soft)}
  .basebtn{border:1px solid var(--rule);background:transparent;border-radius:5px;padding:2px 7px;font-size:10.5px;color:var(--soft);cursor:pointer;margin-top:3px;display:inline-block}
  .basebtn.on{background:var(--yellow);border-color:var(--dark);color:var(--dark);font-weight:700}
  .pchip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--dark);border-radius:8px;padding:8px 12px;box-shadow:2px 2px 0 var(--dark)}
  .pchip .x{border:0;background:transparent;color:var(--soft);cursor:pointer;font-size:16px;line-height:1}
  .summary{background:var(--card);border:1.5px solid var(--dark);border-radius:10px;box-shadow:3px 3px 0 var(--dark);padding:15px 18px;margin-bottom:14px}
  .summary li{margin:5px 0;line-height:1.45}
  a.io{color:var(--blue);text-decoration:none}
  @media(max-width:560px){ .title{font-size:34px} .tx .cat{width:130px} .kpi{min-width:120px} }
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loader">Загружаю кассу…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ─────────── конфиг ─────────── */
var API = 'https://script.google.com/macros/s/AKfycbxOe9cad0ezo7_pWEJA_y_O3TvzuIQOKTUkxHsRY4-YeyVoLHz2rCwZiKG1aStMWm6Zeg/exec';
var KEY = 'bv-kasa-2026-ed01';

var CAT_OUT = [
  ['Ингредиенты','#8C5A2B'],['Снабжение','#B08900'],['Зарплаты','#B4463F'],['Аренда','#5B6BA8'],
  ['Услуги','#2F6690'],['Налоги','#4A4A55'],['Маркетинг','#C2632F'],['Типография','#7A3E8F'],
  ['Интернет','#2E7D6B'],['Бухгалтерия','#3E7C8F'],['Банковская комиссия','#8A6D3B'],
  ['Снятие наличных','#6E6F68'],['Комиссии агрегаторов','#C79A00'],['Прочее','#9A9A90']
];
var CAT_IN = [
  ['Розница','#2E7D6B'],['B2B','#2F6690'],['Wolt','#1E88A8'],['Glovo','#C79A00'],['Njuppa','#7A3E8F'],['Прочее','#9A9A90']
];
var AGG = ['Wolt','Glovo','Njuppa'];
var MON = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
var MON_FULL = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function catColor(n){
  var f=CAT_OUT.concat(CAT_IN).filter(function(c){return c[0]===n;})[0];
  return f?f[1]:'#9A9A90';
}

/* ─────────── состояние ─────────── */
var S = { tx:[], reports:[], config:{}, mode:'week', active:null, splitId:null, adding:false, gear:false, aggMonth:null, aggDraft:{}, from:'', to:'', view:'dash', cmp:[], cmpBase:0 };

/* ─────────── утилиты ─────────── */
function fmt(n){ return new Intl.NumberFormat('ru-RU').format(Math.round(n||0)); }
function pad(n){ return ('0'+n).slice(-2); }
function fmtRu(s){ if(!s) return '…'; var p=String(s).split('-'); return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:s; }
function num(v){ if(typeof v==='number')return v; if(v==null||v==='')return 0;
  return Number(String(v).replace(/\s/g,'').replace(',','.'))||0; }
function monthKey(d){ return String(d).slice(0,7); }
function monthLabel(k){ return MON_FULL[Number(k.slice(5,7))-1]+' '+k.slice(0,4); }
function monthLabelShort(k){ return MON[Number(k.slice(5,7))-1]+' '+k.slice(0,4); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* нормализация даты: Sheets отдаёт то строку YYYY-MM-DD, то ISO с временем, то Date */
function ymd(v){
  if(v==null||v==='') return '';
  var s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;        // чистая дата — как есть
  var d=new Date(v);                                  // ISO со временем / Date → локальное время
  if(!isNaN(d)) return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return s.slice(0,10);
}

function bucketOf(dateStr, mode){
  var d=new Date(dateStr+'T00:00:00');
  if(mode==='day') return {key:dateStr,label:pad(d.getDate())+'.'+pad(d.getMonth()+1)};
  if(mode==='month') return {key:monthKey(dateStr),label:monthLabelShort(monthKey(dateStr))};
  var m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7));
  return {key:m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(m.getDate()),label:pad(m.getDate())+'.'+pad(m.getMonth()+1)};
}
function parseSplits(v){ if(!v)return null; try{ var a=typeof v==='string'?JSON.parse(v):v; return (a&&a.length)?a:null; }catch(e){ return null; } }
function outByCat(tx){ var sp=parseSplits(tx.splits); return sp?sp.map(function(s){return {cat:s.cat,amount:num(s.amount)};}):[{cat:tx.category||'Без категории',amount:num(tx.amount)}]; }

/* ─────────── сеть ─────────── */
function load(){
  fetch(API+'?action=getAll').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok) throw new Error('bad');
    S.tx=(d.tx||[]).map(function(t){ t.amount=num(t.amount); t.date=ymd(t.date); if(t.tradeDate)t.tradeDate=ymd(t.tradeDate); return t; });
    S.reports=d.reports||[];
    S.config=d.config||{};
    if(S.config.defaultMode) S.mode=S.config.defaultMode;
    var months=uniqMonths();
    S.aggMonth=months[0]||monthKey((S.tx[0]||{}).date||'2025-12');
    S.aggDraft=reportsToDraft();
    computeDefaultActive();
    render();
  }).catch(function(){
    document.getElementById('app').innerHTML='<div class="empty">Не удалось связаться с таблицей.<br>Проверь, что веб-приложение развёрнуто с доступом «Все», и обнови страницу.</div>';
  });
}
function post(action, payload){
  var body=Object.assign({action:action,key:KEY},payload||{});
  return fetch(API,{method:'post',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.json();});
}

/* ─────────── производные ─────────── */
function uniqMonths(){ var s={}; S.tx.forEach(function(t){ if(t.date) s[monthKey(t.date)]=1; }); return Object.keys(s).sort().reverse(); }
function reportsToDraft(){ var m={}; S.reports.forEach(function(r){ m[r.month]=m[r.month]||{}; m[r.month][r.channel]=r.gross; }); return m; }
function buckets(){
  var m={};
  S.tx.forEach(function(t){ var b=bucketOf(t.date,S.mode); if(!m[b.key])m[b.key]={key:b.key,label:b.label,in:0,out:0}; m[b.key][t.dir]+=num(t.amount); });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.key<b.key?-1:1;});
}
function computeDefaultActive(){
  var bs=buckets();
  S.active=(S.config.defaultScope==='all')?null:(bs.length?bs[bs.length-1].key:null);
}
function inRange(d){ return (!S.from || d>=S.from) && (!S.to || d<=S.to); }
function rangeActive(){ return !!(S.from || S.to); }
function shownTx(){
  if(rangeActive()) return S.tx.filter(function(t){ return inRange(ymd(t.date)); });
  return S.active?S.tx.filter(function(t){return bucketOf(t.date,S.mode).key===S.active;}):S.tx;
}

/* ─────────── SVG-графики ─────────── */
function barChart(bs, active){
  if(!bs.length) return '<div class="empty">Нет операций.</div>';
  var W=Math.max(bs.length*54,320), H=168, mid=H/2, max=1;
  bs.forEach(function(b){ max=Math.max(max,b.in,b.out); });
  var bw=Math.min(20,(W/bs.length)/2-3);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="168" preserveAspectRatio="xMidYMid meet" style="overflow:visible">';
  s+='<line x1="0" y1="'+mid+'" x2="'+W+'" y2="'+mid+'" stroke="var(--rule)"/>';
  bs.forEach(function(b,i){
    var cx=(i+0.5)*(W/bs.length);
    var hin=(b.in/max)*(mid-8), hout=(b.out/max)*(mid-8);
    var dim=active&&active!==b.key;
    var cin=dim?'var(--inSoft)':'var(--in)', cout=dim?'var(--outSoft)':'var(--out)';
    s+='<rect x="'+(cx-bw-1)+'" y="'+(mid-hin)+'" width="'+bw+'" height="'+hin+'" rx="2" fill="'+cin+'" style="cursor:pointer" data-k="'+b.key+'"/>';
    s+='<rect x="'+(cx+1)+'" y="'+mid+'" width="'+bw+'" height="'+hout+'" rx="2" fill="'+cout+'" style="cursor:pointer" data-k="'+b.key+'"/>';
    s+='<text x="'+cx+'" y="'+(H-2)+'" text-anchor="middle" font-size="10.5" fill="var(--soft)" style="cursor:pointer" data-k="'+b.key+'">'+esc(b.label)+'</text>';
  });
  s+='</svg>';
  return s;
}
function donut(data){
  var total=data.reduce(function(a,d){return a+d.value;},0);
  if(!total) return '<div style="width:150px;height:150px;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:12px">нет данных</div>';
  var cx=75,cy=75,r=58,ir=36, ang=-Math.PI/2, s='<svg viewBox="0 0 150 150" width="150" height="150">';
  data.forEach(function(d){
    var frac=d.value/total, a2=ang+frac*2*Math.PI;
    if(frac>0.9999){ // полный круг
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r+ir)/2)+'" fill="none" stroke="'+catColor(d.name)+'" stroke-width="'+(r-ir)+'"/>';
    } else {
      var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      var xi1=cx+ir*Math.cos(a2), yi1=cy+ir*Math.sin(a2), xi2=cx+ir*Math.cos(ang), yi2=cy+ir*Math.sin(ang);
      var big=frac>0.5?1:0;
      s+='<path d="M'+x1+' '+y1+' A'+r+' '+r+' 0 '+big+' 1 '+x2+' '+y2+' L'+xi1+' '+yi1+' A'+ir+' '+ir+' 0 '+big+' 0 '+xi2+' '+yi2+' Z" fill="'+catColor(d.name)+'"/>';
    }
    ang=a2;
  });
  s+='</svg>';
  return s;
}
function legend(rows,total,wide){
  if(!rows.length) return '<div class="muted" style="font-size:12.5px;padding:8px 0">Нет данных за период.</div>';
  return '<div style="flex:1 1 200px;min-width:0">'+rows.map(function(d){
    var pct=(d.value/(total||1))*100;
    return '<div class="lg"><span class="dot" style="background:'+catColor(d.name)+'"></span>'+
      '<span class="nm" style="width:'+(wide?116:90)+'px;flex:0 0 auto">'+esc(d.name)+'</span>'+
      '<span class="bar-track"><span class="bar-fill" style="width:'+pct.toFixed(1)+'%;background:'+catColor(d.name)+'"></span></span>'+
      '<span class="mono" style="width:44px;text-align:right;font-weight:600;font-size:12px">'+pct.toFixed(1)+'%</span>'+
      '<span class="mono muted" style="width:72px;text-align:right;font-size:11.5px">'+fmt(d.value)+'</span></div>';
  }).join('')+'</div>';
}

/* ─────────── рендер ─────────── */
/* ─────────── сравнение периодов ─────────── */
function daysBetween(from,to){ return Math.round((new Date(to)-new Date(from))/86400000)+1; }
function lastDayOfMonth(k){ var y=+k.slice(0,4),m=+k.slice(5,7); var d=new Date(y,m,0); return y+'-'+pad(m)+'-'+pad(d.getDate()); }

function cmpPeriodDef(p){
  if(p.kind==='month'){ var f=p.month+'-01', t=lastDayOfMonth(p.month); return {from:f,to:t,days:daysBetween(f,t),label:monthLabel(p.month)}; }
  return {from:p.from,to:p.to,days:daysBetween(p.from,p.to),label:fmtRu(p.from)+'–'+fmtRu(p.to)};
}
function cmpAgg(def){
  var rows=S.tx.filter(function(t){ var d=ymd(t.date); return d>=def.from && d<=def.to; });
  var totIn=0,totOut=0,cats={},chans={};
  rows.forEach(function(t){
    if(t.dir==='in'){ totIn+=num(t.amount); var c=t.channel||'Прочее'; chans[c]=(chans[c]||0)+num(t.amount); }
    else { totOut+=num(t.amount); outByCat(t).forEach(function(x){ cats[x.cat]=(cats[x.cat]||0)+x.amount; }); }
  });
  return {totIn:totIn,totOut:totOut,net:totIn-totOut,cats:cats,chans:chans};
}

function addCmpMonth(k){
  if(!k) return;
  if(S.cmp.some(function(p){return p.kind==='range';})){ toast('Тут уже диапазоны. Нельзя смешивать месяцы и диапазоны — очисти или выбери одно.'); return; }
  if(S.cmp.some(function(p){return p.kind==='month'&&p.month===k;})){ toast('Этот месяц уже добавлен'); return; }
  S.cmp.push({kind:'month',month:k}); render();
}
function addCmpRange(from,to){
  if(!from||!to){ toast('Укажи обе даты'); return; }
  if(from>to){ toast('Начало позже конца'); return; }
  if(S.cmp.some(function(p){return p.kind==='month';})){ toast('Тут уже месяцы. Нельзя смешивать месяцы и диапазоны — очисти или выбери одно.'); return; }
  var days=daysBetween(from,to);
  var otherRanges=S.cmp.filter(function(p){return p.kind==='range';});
  if(otherRanges.length){
    var need=daysBetween(otherRanges[0].from,otherRanges[0].to);
    if(days!==need){ toast('Диапазон должен быть '+need+' дн., как первый. У этого '+days+' дн.'); return; }
  }
  S.cmp.push({kind:'range',from:from,to:to}); render();
}

function deltaHtml(cur, base, isBase){
  if(isBase) return '<span class="cmp-d flat">база</span>';
  if(base===0){ return cur? '<span class="cmp-d up">новое</span>':'<span class="cmp-d flat">—</span>'; }
  var pct=(cur-base)/Math.abs(base)*100;
  var cls=Math.abs(pct)<0.5?'flat':(pct>0?'up':'down');
  var arr=Math.abs(pct)<0.5?'':(pct>0?'▲':'▼');
  return '<span class="cmp-d '+cls+'">'+arr+' '+(pct>0?'+':'')+pct.toFixed(0)+'%</span>';
}

function renderCompare(){
  var months=uniqMonths();
  var defs=S.cmp.map(cmpPeriodDef);
  var aggs=defs.map(cmpAgg);
  if(S.cmpBase>=S.cmp.length) S.cmpBase=0;
  var H='';

  H+='<div class="viewtabs no-print">'+
     '<button data-view="dash">Дашборд</button>'+
     '<button class="on">Сравнить периоды</button></div>';
  H+='<div class="head"><div><h1 class="serif title">Сравнить периоды</h1>'+
     '<div class="sub">Добавь 2+ периода. Итоги, категории и каналы — рядом, с разницей к базовому.</div></div></div>';

  // добавление периодов
  H+='<div class="period no-print"><div class="period-l">'+
       '<span class="eyebrow" style="margin-right:2px">Добавить</span>'+
       '<select class="inp" data-cmp-month><option value="">месяц…</option>'+
         months.map(function(k){return '<option value="'+k+'">'+monthLabel(k)+'</option>';}).join('')+'</select>'+
       '<span class="muted" style="font-size:12px">или</span>'+
       '<input type="date" class="inp" data-cmp-from title="с"><span class="muted">—</span>'+
       '<input type="date" class="inp" data-cmp-to title="по">'+
       '<button class="chip" data-cmp-addrange>+ диапазон</button>'+
     '</div>'+
     (S.cmp.length?'<div class="period-r"><button class="linkbtn" data-cmp-clear>очистить всё</button></div>':'')+
     '</div>';

  // чипы добавленных периодов
  if(S.cmp.length){
    H+='<div class="row-flex" style="margin-bottom:14px">'+defs.map(function(d,i){
      return '<div class="pchip"><span style="font-weight:600;font-size:13px">'+esc(d.label)+'</span>'+
        '<span class="muted" style="font-size:11px">'+d.days+' дн.</span>'+
        '<button class="x" data-cmp-del="'+i+'">×</button></div>';
    }).join('')+'</div>';
  }

  if(S.cmp.length<2){
    H+='<div class="empty">Добавь хотя бы два периода, чтобы сравнить. Месяцы сравниваются как есть; произвольные диапазоны — только одинаковой длины.</div>';
    document.getElementById('app').innerHTML=H;
    bindCompare(); return;
  }

  // авто-выводы: база vs последний
  H+=cmpSummary(defs,aggs);

  // таблица
  var catNames={}, chanNames={};
  aggs.forEach(function(a){ Object.keys(a.cats).forEach(function(k){catNames[k]=1;}); Object.keys(a.chans).forEach(function(k){chanNames[k]=1;}); });
  var cats=Object.keys(catNames).sort(function(a,b){return (aggs[S.cmpBase].cats[b]||0)-(aggs[S.cmpBase].cats[a]||0);});
  var chans=Object.keys(chanNames).sort(function(a,b){return (aggs[S.cmpBase].chans[b]||0)-(aggs[S.cmpBase].chans[a]||0);});

  H+='<div class="card cmp-scroll"><table class="cmp-tbl"><thead><tr><th>Показатель</th>'+
     defs.map(function(d,i){ return '<th>'+esc(d.label)+'<br><button class="basebtn'+(i===S.cmpBase?' on':'')+'" data-cmp-base="'+i+'">'+(i===S.cmpBase?'✓ база':'сделать базой')+'</button></th>'; }).join('')+
     '</tr></thead><tbody>';

  function metricRow(name, getter, colorSign){
    var base=getter(aggs[S.cmpBase]);
    var tds=aggs.map(function(a,i){
      var v=getter(a);
      var col = colorSign ? (name==='Расход'?'var(--out)':(name==='Приход'?'var(--in)':(v>=0?'var(--in)':'var(--out)'))) : 'var(--ink)';
      return '<td><span class="cmp-val" style="color:'+col+'">'+fmt(v)+'</span>'+deltaHtml(v,base,i===S.cmpBase)+'</td>';
    }).join('');
    return '<tr><td>'+name+'</td>'+tds+'</tr>';
  }
  H+=metricRow('Приход',function(a){return a.totIn;},true);
  H+=metricRow('Расход',function(a){return a.totOut;},true);
  H+=metricRow('Итог',function(a){return a.net;},true);

  H+='<tr class="grouprow"><td colspan="'+(defs.length+1)+'">Расходы по категориям</td></tr>';
  cats.forEach(function(c){ H+=metricRow(c,function(a){return a.cats[c]||0;},false); });
  H+='<tr class="grouprow"><td colspan="'+(defs.length+1)+'">Приходы по каналам</td></tr>';
  chans.forEach(function(c){ H+=metricRow(c,function(a){return a.chans[c]||0;},false); });

  H+='</tbody></table></div>';

  document.getElementById('app').innerHTML=H;
  bindCompare();
}

function cmpSummary(defs,aggs){
  var b=S.cmpBase, last=(b===aggs.length-1)?0:aggs.length-1; // сравниваем базу с другим краем
  var A=aggs[b], B=aggs[last], dA=defs[b], dB=defs[last];
  var lines=[];
  function line(name,va,vb){
    if(va===0&&vb===0) return;
    var diff=vb-va;
    if(va===0){ lines.push({txt:name+': появилось '+fmt(vb)+' (в «'+dA.label+'» не было)', mag:Math.abs(vb)}); return; }
    var pct=diff/Math.abs(va)*100;
    if(Math.abs(pct)<1) return;
    lines.push({txt:name+(diff>0?' вырос':' упал')+' на '+Math.abs(pct).toFixed(0)+'% (было '+fmt(va)+', стало '+fmt(vb)+')', mag:Math.abs(diff)});
  }
  line('Приход', A.totIn, B.totIn);
  line('Расход', A.totOut, B.totOut);
  var allCats={}; Object.keys(A.cats).forEach(function(k){allCats[k]=1;}); Object.keys(B.cats).forEach(function(k){allCats[k]=1;});
  Object.keys(allCats).forEach(function(k){ line('Расход на «'+k+'»', A.cats[k]||0, B.cats[k]||0); });
  var allCh={}; Object.keys(A.chans).forEach(function(k){allCh[k]=1;}); Object.keys(B.chans).forEach(function(k){allCh[k]=1;});
  Object.keys(allCh).forEach(function(k){ line('Приход по «'+k+'»', A.chans[k]||0, B.chans[k]||0); });
  lines.sort(function(x,y){return y.mag-x.mag;});
  var top=lines.slice(0,7);
  if(!top.length) return '';
  return '<div class="summary"><div class="eyebrow" style="margin-bottom:8px">Что изменилось: «'+esc(dA.label)+'» → «'+esc(dB.label)+'»</div><ul style="margin:0;padding-left:18px">'+
    top.map(function(l){return '<li>'+esc(l.txt)+'</li>';}).join('')+'</ul></div>';
}

function bindCompare(){
  var app=document.getElementById('app');
  app.querySelectorAll('[data-view]').forEach(function(b){ b.onclick=function(){ S.view=b.dataset.view; render(); }; });
  var cm=app.querySelector('[data-cmp-month]'); if(cm) cm.onchange=function(){ addCmpMonth(cm.value); };
  var ar=app.querySelector('[data-cmp-addrange]'); if(ar) ar.onclick=function(){
    addCmpRange(app.querySelector('[data-cmp-from]').value, app.querySelector('[data-cmp-to]').value);
  };
  app.querySelectorAll('[data-cmp-del]').forEach(function(b){ b.onclick=function(){ S.cmp.splice(+b.dataset.cmpDel,1); if(S.cmpBase>=S.cmp.length)S.cmpBase=0; render(); }; });
  app.querySelectorAll('[data-cmp-base]').forEach(function(b){ b.onclick=function(){ S.cmpBase=+b.dataset.cmpBase; render(); }; });
  var cc=app.querySelector('[data-cmp-clear]'); if(cc) cc.onclick=function(){ S.cmp=[]; S.cmpBase=0; render(); };
}

       '</select>'+
       '<span class="muted" style="font-size:12px">или</span>'+

       '<button class="chip" data-export-pdf>PDF</button>'+

/* ── агрегаторы ── */
function commissions(){
  var m=S.aggMonth, months=uniqMonths();
  if(!months.length) months=[m];
  function net(ch){ return S.tx.filter(function(t){return t.dir==='in'&&t.channel===ch&&monthKey(t.date)===m;}).reduce(function(a,t){return a+num(t.amount);},0); }

  // сводка по подтверждённому
  var confirmed=AGG.map(function(ch){
    var g=num((reportsToDraft()[m]||{})[ch]); var nt=net(ch); var ok=g>0;
    return {ch:ch,ok:ok,gross:g,net:nt,fee:ok?g-nt:0,pct:ok&&g?((g-nt)/g)*100:0};
  });
  var done=confirmed.filter(function(r){return r.ok;});
  var gsum=done.reduce(function(a,r){return a+r.gross;},0), fsum=done.reduce(function(a,r){return a+r.fee;},0);

  var H='<div class="card panel"><div class="panel-h">'+
    '<span class="eyebrow">Агрегаторы · '+monthLabel(m)+'</span>'+
    '<select class="inp" data-aggmonth>'+months.map(function(k){return '<option value="'+k+'"'+(k===m?' selected':'')+'>'+monthLabel(k)+'</option>';}).join('')+'</select>'+
    '</div>';

  // сводка
  if(done.length){
    H+='<div style="background:var(--bg);border-radius:8px;padding:14px 14px 12px;margin-bottom:14px">'+
      '<div class="agg-sum">'+
        '<div><div class="eyebrow">Заработано всего</div><div class="v mono">'+fmt(gsum)+'</div></div>'+
        '<div><div class="eyebrow">Удержано агрегаторами</div><div class="v mono" style="color:var(--out)">−'+fmt(fsum)+' <span style="font-size:14px">· '+((fsum/(gsum||1))*100).toFixed(1)+'%</span></div></div>'+
        '<div><div class="eyebrow">Дошло до счёта</div><div class="v mono" style="color:var(--in)">'+fmt(gsum-fsum)+'</div></div>'+
      '</div><div class="agg-badges">'+confirmed.map(function(r){
        return '<div class="badge" style="opacity:'+(r.ok?1:.5)+'"><span class="dot" style="background:'+catColor(r.ch)+'"></span>'+
          '<span style="font-size:12.5px;font-weight:600">'+r.ch+'</span>'+
          (r.ok?'<span class="mono" style="font-size:12.5px;color:var(--out)">−'+fmt(r.fee)+'</span><span class="mono" style="font-size:12.5px;font-weight:700">'+r.pct.toFixed(1)+'%</span>':'<span class="muted" style="font-size:11.5px">нет данных</span>')+'</div>';
      }).join('')+'</div></div>';
  } else {
    H+='<div style="background:var(--bg);border-radius:8px;padding:16px 14px;margin-bottom:14px;font-size:12.5px;color:var(--soft)">За '+monthLabel(m)+' ничего не подтверждено. Впиши суммы из отчётов ниже и нажми «Подтвердить».</div>';
  }

  // ввод
  H+='<div class="eyebrow" style="margin-bottom:4px">Ввод из отчётов приложений</div>'+
     '<div class="muted" style="font-size:11.5px;margin-bottom:9px">«На счёт» берётся из изводов. Впиши заработок из отчёта — до вычета комиссии.</div>'+
     '<div class="agg-th"><span style="flex:1 1 84px">Канал</span><span style="width:90px;text-align:right">На счёт</span>'+
     '<span style="width:104px;text-align:right">Заработано</span><span style="width:90px;text-align:right">Комиссия</span><span style="width:50px;text-align:right">%</span></div>';
  var draft=S.aggDraft[m]||{};
  AGG.forEach(function(ch){
    var raw=draft[ch]!=null?draft[ch]:''; var g=num(raw); var nt=net(ch); var has=g>0; var fee=has?g-nt:0; var bad=has&&fee<0;
    H+='<div class="agg-tr"><span style="flex:1 1 84px;display:flex;align-items:center;gap:7px;font-size:13px"><span class="dot" style="background:'+catColor(ch)+'"></span>'+ch+'</span>'+
      '<span class="mono" style="width:90px;text-align:right;color:var(--in);font-size:12.5px">'+fmt(nt)+'</span>'+
      '<input type="number" class="inp mono" data-aggin="'+ch+'" value="'+esc(raw)+'" placeholder="—" style="width:104px;text-align:right'+(bad?';border-color:var(--out)':'')+'">'+
      '<span class="mono" data-aggfee="'+ch+'" style="width:90px;text-align:right;font-size:12.5px;color:'+(has?'var(--out)':'var(--soft)')+';font-weight:600">'+(has?'−'+fmt(fee):'—')+'</span>'+
      '<span class="mono" data-aggpct="'+ch+'" style="width:50px;text-align:right;font-size:12.5px;font-weight:700;color:'+(has?'var(--ink)':'var(--soft)')+'">'+(has?((fee/g)*100).toFixed(1)+'%':'—')+'</span>'+
      '<span data-aggwarn="'+ch+'" style="flex-basis:100%;font-size:11.5px;color:var(--out);padding-top:2px;display:'+(bad?'block':'none')+'">Заработок меньше, чем пришло на счёт. Проверь, не чистая ли это сумма.</span></div>';
  });
  var dirty=AGG.some(function(ch){ return String((S.aggDraft[m]||{})[ch]==null?'':S.aggDraft[m][ch])!==String((reportsToDraft()[m]||{})[ch]==null?'':reportsToDraft()[m][ch]); });
  var bad=AGG.some(function(ch){ var g=num((S.aggDraft[m]||{})[ch]); return g>0 && g-net(ch)<0; });
  H+='<div style="display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:12px">'+
     (dirty&&!bad?'<span style="font-size:11.5px;color:var(--blue)">есть неподтверждённые изменения</span>':'')+
     '<button class="btn accent" data-aggconfirm '+((dirty&&!bad)?'':'disabled')+'>Подтвердить</button></div>';
  H+='</div>';
  return H;
}

/* ── редактор разбивки ── */
var SPLIT_ROWS=[];
function splitEditor(t){
  var total=SPLIT_ROWS.reduce(function(a,r){return a+num(r.amount);},0);
  var left=num(t.amount)-total;
  var ok=Math.abs(left)<0.5 && SPLIT_ROWS.every(function(r){return num(r.amount)>0;});
  var H='<div class="split"><div class="eyebrow" style="color:#8a6d00;font-weight:700;margin-bottom:10px">Разнести '+fmt(t.amount)+' по категориям</div>';
  SPLIT_ROWS.forEach(function(r,i){
    H+='<div class="srow"><span style="color:var(--blue)">└</span>'+
      '<select class="inp" data-si-cat="'+i+'" style="flex:1 1 auto;min-width:0">'+CAT_OUT.map(function(c){return '<option'+(c[0]===r.cat?' selected':'')+'>'+c[0]+'</option>';}).join('')+'</select>'+
      '<input type="number" class="inp mono" data-si-amt="'+i+'" value="'+esc(r.amount)+'" placeholder="0" style="width:108px;text-align:right">'+
      '<button class="miniact" data-si-del="'+i+'" style="font-size:15px">×</button></div>';
  });
  H+='<button class="miniact on" data-si-add style="margin-left:20px">+ ещё категория</button>'+
     '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:11px;border-top:1px solid #e8d98f;flex-wrap:wrap">'+
       '<div class="mono" style="font-size:13px;font-weight:600;color:'+(Math.abs(left)<0.5?'var(--in)':'var(--out)')+'">'+(Math.abs(left)<0.5?'✓ сходится':'осталось разнести: '+fmt(left))+'</div>'+
       '<div style="display:flex;gap:8px"><button class="btn ghost" data-si-cancel>Отмена</button>'+
       '<button class="btn accent" data-si-save="'+t.id+'" '+(ok?'':'disabled')+'>Сохранить разбивку</button></div>'+
     '</div></div>';
  return H;
}

}

/* «запомнить»: спросить слово-ключ и создать правило контрагент→категория */
function offerRemember(t, target, dir){
  var name = String(t.counterparty||'').trim();
  if(!name) return;
  // берём первое СЛОВО из букв (пропускаем номера счетов вроде "216 -")
  var words = name.split(/[\s,.\-\/]+/).filter(function(w){ return /[A-Za-zА-Яа-яЁёČĆŠĐŽčćšđž]{3,}/.test(w); });
  var suggested = (words[0] || name).slice(0,40);
  var kw = window.prompt(
    'Запомнить правило: все операции, где встречается это слово, будут автоматически попадать в «'+target+'».\n\n'+
    'Ставь такое правило только для однозначных поставщиков. Если контрагент бывает разным — лучше не запоминать.\n\n'+
    'По какому слову узнавать контрагента?',
    suggested
  );
  if(kw===null) return;
  kw = kw.trim(); if(!kw) return;
  post('addRule',{keyword:kw, dir:dir, target:target, kind: dir==='in'?'channel':'category'}).then(function(r){
    if(r&&r.ok){
      var n=r.applied||0;
      // перекрашиваем строки в памяти локально — без перезагрузки, период не слетает
      var low=kw.toLowerCase();
      S.tx.forEach(function(t){
        if(t.dir!==dir) return;
        if(String(t.counterparty||'').toLowerCase().indexOf(low)<0) return;
        if(parseSplits(t.splits)) return;
        if(dir==='in') t.channel=target; else { t.category=target; t.splits=''; }
      });
      toast('Запомнил: «'+kw+'» → '+target+(n?(' · применил к '+n+' операциям'):''));
      render();
    } else toast('Правило не сохранилось');
  });
}

function setChannel(id,ch){

  render();
  post('setChannel',{id:id,channel:ch,row:t&&t.row,amount:t&&t.amount,who:t&&t.counterparty,date:t&&ymd(t.date)}).then(function(r){ toast(r&&r.ok?'Канал сохранён':'Не сохранилось: '+((r&&r.error)||'нет связи')); });

function toggleSplit(id){
  if(S.splitId===id){ S.splitId=null; render(); return; }
  var t=S.tx.filter(function(x){return x.id===id;})[0];
  var sp=parseSplits(t.splits);
  SPLIT_ROWS=sp?sp.map(function(s){return {cat:s.cat,amount:s.amount};}):[{cat:CAT_OUT[0][0],amount:''}];
  S.splitId=id; render();
}
function bindSplit(app){
  app.querySelectorAll('[data-si-cat]').forEach(function(s){ s.onchange=function(){ SPLIT_ROWS[+s.dataset.siCat].cat=s.value; }; });
  app.querySelectorAll('[data-si-amt]').forEach(function(i){ i.oninput=function(){ SPLIT_ROWS[+i.dataset.siAmt].amount=i.value; refreshSplitFooter(); }; });
  app.querySelectorAll('[data-si-del]').forEach(function(b){ b.onclick=function(){ SPLIT_ROWS.splice(+b.dataset.siDel,1); render(); }; });
  var a=app.querySelector('[data-si-add]'); if(a) a.onclick=function(){ SPLIT_ROWS.push({cat:'Прочее',amount:''}); render(); };
  var c=app.querySelector('[data-si-cancel]'); if(c) c.onclick=function(){ S.splitId=null; render(); };
  var sv=app.querySelector('[data-si-save]'); if(sv) sv.onclick=function(){ saveSplit(sv.dataset.siSave); };
}
function refreshSplitFooter(){ // лёгкое обновление без полного ре-рендера, чтобы фокус не прыгал
  var t=S.tx.filter(function(x){return x.id===S.splitId;})[0]; if(!t)return;
  var total=SPLIT_ROWS.reduce(function(a,r){return a+num(r.amount);},0); var left=num(t.amount)-total;
  var ok=Math.abs(left)<0.5 && SPLIT_ROWS.every(function(r){return num(r.amount)>0;});
  var foot=document.querySelector('.split .mono'); if(foot){ foot.textContent=Math.abs(left)<0.5?'✓ сходится':'осталось разнести: '+fmt(left); foot.style.color=Math.abs(left)<0.5?'var(--in)':'var(--out)'; }
  var sv=document.querySelector('[data-si-save]'); if(sv){ if(ok) sv.removeAttribute('disabled'); else sv.setAttribute('disabled','1'); }
}
function saveSplit(id){
  var rows=SPLIT_ROWS.map(function(r){return {cat:r.cat,amount:num(r.amount)};});
  var t=S.tx.filter(function(x){return x.id===id;})[0]; if(t){ t.splits=JSON.stringify(rows); t.category=''; }
  S.splitId=null; render();
  post('saveSplit',{id:id,splits:rows,row:t&&t.row,amount:t&&t.amount,who:t&&t.counterparty,date:t&&ymd(t.date)}).then(function(r){ toast(r&&r.ok?'Разбивка сохранена':'Не сохранилось: '+((r&&r.error)||'нет связи')); });
}

function netOfMonth(ch,m){ return S.tx.filter(function(t){return t.dir==='in'&&t.channel===ch&&monthKey(ymd(t.date))===m;}).reduce(function(a,t){return a+num(t.amount);},0); }

function updateAggRow(ch){
  var m=S.aggMonth, g=num((S.aggDraft[m]||{})[ch]), nt=netOfMonth(ch,m), has=g>0, fee=g-nt, bad=has&&fee<0;
  var feeEl=document.querySelector('[data-aggfee="'+ch+'"]');
  var pctEl=document.querySelector('[data-aggpct="'+ch+'"]');
  var warnEl=document.querySelector('[data-aggwarn="'+ch+'"]');
  var inEl=document.querySelector('[data-aggin="'+ch+'"]');
  if(feeEl){ feeEl.textContent=has?'−'+fmt(fee):'—'; feeEl.style.color=has?'var(--out)':'var(--soft)'; }
  if(pctEl){ pctEl.textContent=has?((fee/g)*100).toFixed(1)+'%':'—'; pctEl.style.color=has?'var(--ink)':'var(--soft)'; }
  if(warnEl){ warnEl.style.display=bad?'block':'none'; }
  if(inEl){ inEl.style.borderColor=bad?'var(--out)':'var(--rule)'; }
}
function updateAggConfirm(){
  var m=S.aggMonth;
  var dirty=AGG.some(function(ch){ return String((S.aggDraft[m]||{})[ch]==null?'':S.aggDraft[m][ch])!==String((reportsToDraft()[m]||{})[ch]==null?'':reportsToDraft()[m][ch]); });
  var bad=AGG.some(function(ch){ var g=num((S.aggDraft[m]||{})[ch]); return g>0 && g-netOfMonth(ch,m)<0; });
  var btn=document.querySelector('[data-aggconfirm]');
  if(btn){ if(dirty&&!bad) btn.removeAttribute('disabled'); else btn.setAttribute('disabled','1'); }
}

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1900); }

/* ─────────── выгрузка отчётов ─────────── */
function reportData(){
  var sh = shownTx().slice().sort(function(a,b){ return ymd(a.date)<ymd(b.date)?-1:1; });
  var totIn = sh.filter(function(t){return t.dir==='in';}).reduce(function(a,t){return a+num(t.amount);},0);
  var totOut = sh.filter(function(t){return t.dir==='out';}).reduce(function(a,t){return a+num(t.amount);},0);
  var inM={}; sh.filter(function(t){return t.dir==='in';}).forEach(function(t){ var c=t.channel||'Прочее'; inM[c]=(inM[c]||0)+num(t.amount); });
  var chans=Object.keys(inM).map(function(k){return {name:k,value:inM[k]};}).sort(function(a,b){return b.value-a.value;});
  var outM={}; sh.filter(function(t){return t.dir==='out';}).forEach(function(t){ outByCat(t).forEach(function(x){ outM[x.cat]=(outM[x.cat]||0)+x.amount; }); });
  var cats=Object.keys(outM).map(function(k){return {name:k,value:outM[k]};}).sort(function(a,b){return b.value-a.value;});
  var label = rangeActive() ? (fmtRu(S.from)+' — '+fmtRu(S.to)) : (S.active?(buckets().filter(function(b){return b.key===S.active;})[0]||{}).label:'всё время');
  return { rows:sh, totIn:totIn, totOut:totOut, chans:chans, cats:cats, label:label };
}

function exportXLSX(){
  if(typeof XLSX==='undefined'){ toast('Excel-модуль ещё грузится, повтори через пару секунд'); return; }
  var d=reportData();
  var wb=XLSX.utils.book_new();
  var s1=[['Финансовая отчётность BreadVenture'],['Период',d.label],[],
    ['Приход',d.totIn],['Расход',d.totOut],['Итог',d.totIn-d.totOut],[],
    ['Приходы по каналам',''],['Канал','Сумма','Доля %']];
  d.chans.forEach(function(c){ s1.push([c.name,c.value,+(c.value/(d.totIn||1)*100).toFixed(1)]); });
  s1.push([]); s1.push(['Расходы по категориям','']); s1.push(['Категория','Сумма','Доля %']);
  d.cats.forEach(function(c){ s1.push([c.name,c.value,+(c.value/(d.totOut||1)*100).toFixed(1)]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'Сводка');
  var s2=[['Дата','Тип','Контрагент','Категория/Канал','Сумма','Разбивка']];
  d.rows.forEach(function(t){
    var sp=parseSplits(t.splits);
    var cat = t.dir==='in' ? (t.channel||'') : (sp?'(разбито)':(t.category||''));
    var spTxt = sp?sp.map(function(x){return x.cat+': '+x.amount;}).join('; '):'';
    s2.push([fmtRu(ymd(t.date)), t.dir==='in'?'приход':'расход', t.counterparty||t.opis||'', cat, (t.dir==='in'?1:-1)*num(t.amount), spTxt]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'Операции');
  XLSX.writeFile(wb, 'BreadVenture_отчёт_'+(d.label.replace(/[^\wа-яА-Я]+/g,'_'))+'.xlsx');
}

    '@media print{@page{margin:14mm}}';
  function money(n){ return new Intl.NumberFormat('ru-RU').format(Math.round(n)); }
  var html='<!doctype html><html><head><meta charset="utf-8"><title>Отчёт BreadVenture</title><style>'+css+'</style></head><body>';
  html+='<h1>Финансовая отчётность</h1><div class="sub">BreadVenture · '+d.label+' · RSD</div>';
  html+='<section><div class="kpis">'+
    '<div class="kpi">Приход<b class="g">+'+money(d.totIn)+'</b></div>'+
    '<div class="kpi">Расход<b class="r">−'+money(d.totOut)+'</b></div>'+
    '<div class="kpi">Итог<b class="'+(d.totIn-d.totOut>=0?'g':'r')+'">'+(d.totIn-d.totOut>=0?'+':'−')+money(Math.abs(d.totIn-d.totOut))+'</b></div>'+
    '</div></section>';
  html+='<section><h2>Приходы по каналам</h2><table><thead><tr><th>Канал</th><th class="n">Сумма</th><th class="n">Доля</th></tr></thead><tbody>';
  d.chans.forEach(function(c){ html+='<tr><td>'+c.name+'</td><td class="n">'+money(c.value)+'</td><td class="n">'+(c.value/(d.totIn||1)*100).toFixed(1)+'%</td></tr>'; });
  html+='</tbody></table></section>';
  html+='<section><h2>Расходы по категориям</h2><table><thead><tr><th>Категория</th><th class="n">Сумма</th><th class="n">Доля</th></tr></thead><tbody>';
  d.cats.forEach(function(c){ html+='<tr><td>'+c.name+'</td><td class="n">'+money(c.value)+'</td><td class="n">'+(c.value/(d.totOut||1)*100).toFixed(1)+'%</td></tr>'; });
  html+='</tbody></table></section>';
  html+='<h2 class="reg">Операции ('+d.rows.length+')</h2><table><thead><tr><th>Дата</th><th>Контрагент</th><th>Категория</th><th class="n">Сумма</th></tr></thead><tbody>';
  d.rows.forEach(function(t){
    var sp=parseSplits(t.splits);
    var cat = t.dir==='in' ? (t.channel||'') : (sp?'разбито на '+sp.length:(t.category||'—'));
    html+='<tr><td>'+fmtRu(ymd(t.date))+'</td><td>'+esc(t.counterparty||t.opis||'')+'</td><td>'+esc(cat)+'</td>'+
      '<td class="n '+(t.dir==='in'?'g':'r')+'">'+(t.dir==='in'?'+':'−')+money(num(t.amount))+'</td></tr>';
  });
  html+='</tbody></table>';
  html+='<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},300);}</scr'+'ipt></body></html>';
  w.document.write(html); w.document.close();
}
